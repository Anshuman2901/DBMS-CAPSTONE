<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="navbar">
  <span class="brand">Placement Portal - Admin</span>
  <div><span id="welcome"></span><a href="#" onclick="logout()">Logout</a></div>
</div>
<div class="container">
  <div class="tabs">
    <a href="dashboard.html">Dashboard</a>
    <a href="students.html" id="t_students">Students</a>
    <a href="companies.html" id="t_companies">Companies</a>
    <a href="jobs.html" id="t_jobs">Jobs</a>
    <a href="applications.html" id="t_applications">Applications</a>
    <a href="interviews.html" id="t_interviews">Interviews</a>
    <a href="placements.html" id="t_placements">Placements</a>
    <a href="reports.html" id="t_reports">Reports</a>
  </div>
  <div class="card">
    <h3>Add Student</h3>
    <div id="msg"></div>
    <form id="form">
      <label>Roll No</label><input id="roll_no" required>
      <label>First Name</label><input id="first_name" required>
      <label>Last Name</label><input id="last_name">
      <label>Email</label><input id="email" type="email" required>
      <label>Phone</label><input id="phone">
      <label>Department</label><input id="department" required>
      <label>Course</label><input id="course">
      <label>Graduation Year</label><input id="graduation_year" type="number" required>
      <label>CGPA</label><input id="cgpa" type="number" step="0.01" required>
      <label>Backlogs</label><input id="backlogs" type="number" value="0">
      <button class="btn" type="submit">Add Student</button>
    </form>
  </div>
  <div class="card">
    <h3>All Students</h3>
    <input class="search-bar" id="searchStudents" placeholder="🔍 Search students...">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Roll No</th><th>Name</th><th>Dept</th><th>CGPA</th><th>Backlogs</th><th>Email</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
requireLogin('Admin');
document.getElementById('welcome').textContent = getName();
document.getElementById('t_students').className = 'active';

async function load() {
    const rows = await apiRequest('/students');
    document.getElementById('body').innerHTML = rows.map(s => `
        <tr><td>${s.roll_no}</td><td>${s.first_name} ${s.last_name||''}</td><td>${s.department}</td><td>${s.cgpa}</td><td>${s.backlogs}</td><td>${s.email}</td></tr>
    `).join('');
}

document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    try {
        await apiRequest('/students', 'POST', {
            roll_no: roll_no.value, first_name: first_name.value, last_name: last_name.value,
            email: email.value, phone: phone.value, department: department.value, course: course.value,
            graduation_year: Number(graduation_year.value), cgpa: Number(cgpa.value), backlogs: Number(backlogs.value || 0)
        });
        msg.innerHTML = '<div class="msg success">Student added.</div>';
        e.target.reset();
        load();
    } catch (err) {
        msg.innerHTML = `<div class="msg error">${err.message}</div>`;
    }
});
load();
addTableSearch('searchStudents', 'body');
</script>
</body>
</html>
